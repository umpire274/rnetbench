[package]
name = "rnetbench"
version = "0.1.5"
edition = "2024"
license = "MIT"
authors = ["Alessandro Maestri <umpire274@gmail.com>"]
homepage = "https://github.com/umpire274/rNetBench"
repository = "https://github.com/umpire274/rNetBench"
description = "A modern, cross-platform network benchmarking tool (download, upload, latency, jitter) written in Rust."
readme = "README.md"
keywords = ["network", "speedtest", "benchmark", "cli", "bandwidth"]
categories = ["command-line-utilities", "network-programming", "simulation"]

# Includiamo solo ciò che serve nei pacchetti
include = [
    "src/**/*",
    "assets/**/*",
    "Cargo.toml",
    "build.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE"
]

# build.rs include l’icona su Windows
build = "build.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots"] }

[build-dependencies]
winresource = "0.1.27"

[package.metadata.winres]
Icon = "assets/rnetbench.ico"

[package.metadata.deb]
maintainer = "Alessandro Maestri <umpire274@gmail.com>"
section = "utils"
priority = "optional"
license-file = ["LICENSE", "0"]
depends = "$auto"

assets = [
    ["target/release/rnetbench", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rnetbench/", "644"],
    ["CHANGELOG.md", "usr/share/doc/rnetbench/", "644"],
    ["LICENSE", "usr/share/licenses/rnetbench/", "644"],
    # Icons
    ["assets/rnetbench_1024.png", "usr/share/icons/hicolor/1024x1024/apps/rnetbench.png", "644"],
    ["assets/rnetbench_512.png", "usr/share/icons/hicolor/512x512/apps/rnetbench.png", "644"],
    ["assets/rnetbench_256.png", "usr/share/icons/hicolor/256x256/apps/rnetbench.png", "644"],
    ["assets/rnetbench_128.png", "usr/share/icons/hicolor/128x128/apps/rnetbench.png", "644"],
    ["assets/rnetbench_64.png", "usr/share/icons/hicolor/64x64/apps/rnetbench.png", "644"],
    ["assets/rnetbench_48.png", "usr/share/icons/hicolor/48x48/apps/rnetbench.png", "644"],
    ["assets/rnetbench_32.png", "usr/share/icons/hicolor/32x32/apps/rnetbench.png", "644"],
    ["assets/rnetbench_16.png", "usr/share/icons/hicolor/16x16/apps/rnetbench.png", "644"]
]
